name: CI

on:
  workflow_call:

jobs:
  base_source_checks:
    name: "Base source checks"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '>=3.12'

      - uses: pre-commit/action@v3.0.1


  tests:
    name: "${{ matrix.imagename }} -- ${{ matrix.machine }} -- ${{ matrix.args }}"
    runs-on: ${{ matrix.runson }}

    container:
      image: ${{ matrix.container }}

    strategy:
      matrix:
        include:

          ##########################################################################################
          # Arch Linux
          ##########################################################################################
          - machine: archlinux.acpp
            container: archlinux/archlinux:base-devel
            runson: ubuntu-latest
            imagename: ArchLinux
            ccache-key-extra: generic

          ##########################################################################################
          # MacOS
          ##########################################################################################
          - machine: macos.brew.acpp
            runson: macos-14
            imagename: MacOS-14
            ccache-key-extra: macos14

          - machine: macos.brew.acpp
            runson: macos-15
            imagename: MacOS-15
            ccache-key-extra: macos15

          - machine: macos.brew.acpp
            runson: macos-15-intel
            imagename: MacOS-15 (intel)
            ccache-key-extra: macos15-intel

          - machine: macos.brew.acpp
            runson: macos-26
            imagename: MacOS-26
            ccache-key-extra: macos26
    env:
      FORCE_COLOR: true

    steps:
      - name: Install ccache
        if: matrix.machine == 'archlinux.acpp'
        run: |
          sudo pacman -Sy --noconfirm ccache

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{matrix.machine}}-${{matrix.ccache-key-extra}}
          verbose: 2

      - name: Configure ccache
        shell: bash
        run: |
          echo " ----- ccache configuration ----- "
          echo " Old configuration: "
          ccache -p
          echo " ----- New configuration:   ----- "
          ccache -o compiler_check='%compiler% -dumpmachine; %compiler% -dumpversion'
          ccache -p
          echo " ----- ccache configuration done ----- "

      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: build syclenv (fail if no prerequisites installed)
        shell: bash
        run: ./syclenv create ${{ matrix.machine }} .yolo || true

      - name: build syclenv (and install prerequisites)
        shell: bash
        run: ./syclenv create --noconfirm --install-prerequisites ${{ matrix.machine }} .yolo

      - name: cat activate script
        shell: bash
        run: cat .yolo/activate.bash

      - name: activate syclenv
        shell: bash
        run: eval "$(./syclenv activate .yolo)"

      - name: Create SYCL source file
        run: |
          cat << 'EOF' > main.cpp
          #include <sycl/sycl.hpp>

          int main(){
              return 0;
          }
          EOF

      - name: compile a hello world program
        shell: bash
        run:  |
          eval "$(./syclenv activate .yolo)"
          syclcc $SYCL_FLAGS main.cpp
          ./a.out

      - name: activate and deactivate restore shell environment
        shell: bash
        run: |
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT

          ./scripts/snapshot-shell-env.sh "$before"

          eval "$(./syclenv activate .yolo)"
          deactivate
          ./scripts/snapshot-shell-env.sh "$after"

          set -euo pipefail
          ./scripts/compare-shell-env-snapshots.sh "$before" "$after"
