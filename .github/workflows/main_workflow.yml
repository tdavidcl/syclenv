name: CI

on:
  workflow_call:

jobs:
  base_source_checks:
    name: "Base source checks"
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '>=3.12'

      - uses: pre-commit/action@v3.0.1


  tests:
    name: "${{ matrix.imagename }} -- ${{ matrix.machine }} -- ${{ matrix.args }}"
    runs-on: ${{ matrix.runson }}

    container:
      image: ${{ matrix.container }}

    strategy:
      matrix:
        include:

          ##########################################################################################
          # Arch Linux
          ##########################################################################################
          - machine: archlinux.acpp
            container: archlinux/archlinux:base-devel
            runson: ubuntu-latest
            imagename: ArchLinux

    steps:

      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: build syclenv (fail if no prerequisites installed)
        shell: bash
        run: ./syclenv create archlinux.acpp .yolo || true

      - name: build syclenv (and install prerequisites)
        shell: bash
        run: ./syclenv create --noconfirm --install-prerequisites archlinux.acpp .yolo

      - name: activate syclenv
        shell: bash
        run: eval "$(./syclenv activate .yolo)"

      - name: activate and deactivate restore shell environment
        shell: bash
        run: |
          before="$(mktemp)"
          after="$(mktemp)"
          trap 'rm -f "$before" "$after"' EXIT

          ./scripts/snapshot-shell-env.sh "$before"

          eval "$(./syclenv activate .yolo)"
          deactivate
          ./scripts/snapshot-shell-env.sh "$after"

          set -euo pipefail
          ./scripts/compare-shell-env-snapshots.sh "$before" "$after"
