[project]
name = "syclenv"
version = "0.1.0"
description = "SYCL environment tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
syclenv = "syclenv.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
syclenv = [
    "**/*.sh",
    "**/*.bash",
]

[tool.setuptools]
include-package-data = true

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
